name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://example.com
      API_BASE_URL: https://jsonplaceholder.typicode.com
      API_HEALTH_PATH: /posts/1
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: api-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  ui-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: api-tests
    env:
      BASE_URL: https://example.com
      API_BASE_URL: https://jsonplaceholder.typicode.com
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - name: Run UI smoke tests
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  e2e-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: ui-tests
    env:
      BASE_URL: https://example.com
      API_BASE_URL: https://jsonplaceholder.typicode.com
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/junit.xml
          retention-days: 30
